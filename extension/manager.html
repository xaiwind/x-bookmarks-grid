<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X 收藏瀑布流</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="manager.css">
    <link rel="stylesheet" href="theme.css">
  </head>
  <body class="manager-body live-manager">
    <header class="manager-header">
      <div class="brand-mark" aria-hidden="true">✳</div>
      <div class="brand-copy"><span class="eyebrow">YOUR PERSONAL LIBRARY</span><h1>收藏，值得再看一遍。</h1><p>你的 X 书签，在这里慢慢发现。</p></div>
      <div class="header-metrics" aria-label="收藏同步统计">
        <div><span id="sourceLabel">X 收藏总数</span><strong id="sourceTotal">—</strong></div>
        <div><span>已同步到插件</span><strong id="syncedTotal">0</strong></div>
      </div>
      <button type="button" id="languageToggle" class="language-toggle"></button>
    </header>

    <section class="toolbar live-toolbar">
      <div class="toolbar-top-row">
        <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="搜索标题、作者或链接，@名字 可搜作者" aria-label="搜索收藏"><kbd>/</kbd></div>
        <div class="toolbar-refine-row">
          <div class="author-picker">
            <input id="author" role="combobox" aria-label="筛选作者" aria-expanded="false" aria-controls="authorList" aria-autocomplete="list" placeholder="筛选作者" autocomplete="off" spellcheck="false">
            <button type="button" id="authorClear" class="author-clear" aria-label="清除作者筛选" title="清除作者筛选" hidden>×</button>
            <ul id="authorList" class="author-list" role="listbox" aria-label="作者" hidden></ul>
          </div>
          <input id="fromDate" type="date" aria-label="开始日期" title="发布日期不早于">
          <input id="toDate" type="date" aria-label="结束日期" title="发布日期不晚于">
          <select id="hasLinks" aria-label="外链筛选">
            <option value="">全部链接</option>
            <option value="yes">包含外链</option>
            <option value="no">不含外链</option>
          </select>
        </div>
      </div>
      <div class="toolbar-bottom-row">
        <div class="toolbar-filter-group">
          <div class="type-filters" role="group" aria-label="内容类型筛选（每条收藏只属于一类）" title="每条收藏只属于一类，各类数量相加等于“全部”">
            <button type="button" class="type-filter active" data-filter="all" aria-pressed="true">全部 <small></small></button>
            <button type="button" class="type-filter" data-filter="article" aria-pressed="false">文章 <small></small></button>
            <button type="button" class="type-filter" data-filter="video" aria-pressed="false">视频 <small></small></button>
            <button type="button" class="type-filter" data-filter="image" aria-pressed="false">图片 <small></small></button>
            <button type="button" class="type-filter" data-filter="text" aria-pressed="false">纯文字 <small></small></button>
            <button type="button" class="type-filter" data-filter="untitled" aria-pressed="false">无标题 <small></small></button>
          </div>
          <button type="button" id="viralToggle" class="viral-toggle" aria-pressed="false" title="只看浏览量超过 100 万的收藏；可以和左边任意分类一起用">🔥 百万爆款 <small></small></button>
        </div>
        <div class="toolbar-actions-row">
          <button id="exportBackup" title="把全部本地收藏导出成一个备份文件，用于换电脑或移动插件文件夹">导出备份</button>
          <button id="importBackup" title="从备份文件恢复收藏；只补充缺少的内容，不会覆盖或删除现有数据">导入备份</button>
          <input id="backupFile" type="file" accept="application/json,.json" hidden>
          <button id="fullRescan" title="从头到尾重新读取全部收藏，刷新封面和标题；不会删除任何本地数据">完整重扫</button>
          <button id="syncNow" class="primary">＋ 同步全部收藏</button>
        </div>
      </div>
      <div id="syncProgress" class="sync-progress" hidden>
        <div class="sync-progress-track" role="progressbar" aria-label="同步进度"><div id="syncProgressBar" class="sync-progress-bar"></div></div>
        <button type="button" id="stopSync" class="link-button">停止</button>
      </div>
    </section>

    <main class="library-section">
      <div class="library-heading">
        <div><span class="eyebrow">THE COLLECTION</span><h2>你的收藏 <span id="count"></span></h2><p id="status" class="muted" aria-live="polite">正在读取插件本地收藏…</p><p id="sourceCountHint" class="muted"></p><p id="titleHint" class="muted" hidden></p></div>
        <div class="library-controls"><button type="button" id="clearFilters" hidden>清除筛选</button><label class="sort-label"><span class="sr-only">排序方式</span><select id="sort"><option value="bookmarked">收藏时间 · 最新</option><option value="newest">发布时间 · 最新</option><option value="oldest">发布时间 · 最早</option><option value="views">浏览量 · 最高</option><option value="imported">导入时间 · 最新</option></select></label></div>
      </div>
      <div id="rows" class="bookmark-masonry"></div>
    </main>

    <div id="cardMenu" class="card-menu" role="menu" aria-label="收藏操作" hidden></div>
    <dialog id="editDialog" class="edit-dialog" aria-labelledby="editHeading">
      <form method="dialog">
        <h2 id="editHeading">编辑文章</h2>
        <label for="editTitle">标题</label>
        <textarea id="editTitle" rows="3" maxlength="200"></textarea>
        <p class="edit-help">改过的标题以后同步不会被覆盖；清空则恢复为 X 上的标题。</p>
        <label for="editNote">备注</label>
        <textarea id="editNote" rows="4" maxlength="2000" placeholder="为什么收藏、打算怎么用…"></textarea>
        <p id="editError" class="edit-error" aria-live="polite"></p>
        <div class="edit-actions"><button type="button" id="editCancel">取消</button><button type="submit" class="primary">保存</button></div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="manager.js"></script>
  </body>
</html>
